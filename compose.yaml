services:
  app:
    build:
      context: .
      args:
        NODE_BUILD_HEAP_MB: ${NODE_BUILD_HEAP_MB:-1024}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - aslung-data:/app/data
      - aslung-backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  calibration-worker:
    build:
      context: .
      args:
        NODE_BUILD_HEAP_MB: ${NODE_BUILD_HEAP_MB:-1024}
    profiles: ["calibration"]
    restart: unless-stopped
    env_file: .env
    command: ["node", "scripts/calibration-worker.mjs"]
    volumes:
      - aslung-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  aslung-data:
  aslung-backups:
