services:
  app:
    build:
      context: .
      args:
        NODE_BUILD_HEAP_MB: ${NODE_BUILD_HEAP_MB:-1024}
    restart: unless-stopped
    env_file: .env
    init: true
    cpu_shares: 1024
    # Optional app cap; 0 keeps the existing unlimited setting.
    mem_limit: ${APP_MEMORY_LIMIT:-0}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - aslung-data:/app/data
      - aslung-backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  calibration-worker:
    build:
      context: .
      args:
        NODE_BUILD_HEAP_MB: ${NODE_BUILD_HEAP_MB:-1024}
    profiles: ["calibration"]
    restart: unless-stopped
    env_file: .env
    init: true
    # Favor interactive web requests when host CPU is busy.
    cpu_shares: 256
    cpus: ${WORKER_CPUS:-0.5}
    mem_limit: ${WORKER_MEMORY_LIMIT:-768m}
    pids_limit: ${WORKER_PIDS_LIMIT:-128}
    stop_grace_period: 120s
    command: ["node", "--max-old-space-size=${WORKER_HEAP_MB:-512}", "scripts/calibration-worker.mjs"]
    volumes:
      - aslung-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  aslung-data:
  aslung-backups:
